<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device.width, initial-scale=1.0,  width.user-scalable=yes">
        <title>Stopwatch Website</title>
        <link href="style.css" rel="stylesheet" type="text/css" />
        <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    </head>
<body>
    <div class="container">
        <h1>STOPWATCH</h1>
        <div class="main">
            <p class="time">
                <span class="hours">00</span>:<span class="minutes">00</span>:<span class="seconds">00</span>:<span class="milliseconds">00</span>
            </p>
            <div class="button-row">
                <button onclick="start()" class="btn-control start">START</button>
                <button onclick="stopTimer()" class="btn-control stop">STOP</button>
                <button onclick="reset()" class="reset">RESET</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
